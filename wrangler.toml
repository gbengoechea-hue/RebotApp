name = "rebotapp"
main = "index.js"
compatibility_date = "2025-09-01"

# Se ejecuta cada 30 minutos (en UTC); el código solo revisa a las HORAS_REVISION
# de la zona horaria indicada. La ejecución de y media recoge avisos pendientes.
[triggers]
crons = ["0,30 * * * *"]

[vars]
UMBRAL_C = "8"
HORAS_REVISION = "8,20"
ZONA = "Europe/Madrid"
HORAS_ENTRE_AVISOS = "18"
NTFY_SERVER = "https://ntfy.sh"

# Almacenamiento de las suscripciones (SQLite integrado, incluido en el plan gratuito)
[[durable_objects.bindings]]
name = "ALMACEN"
class_name = "Almacen"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Almacen"]

[observability]
enabled = true
